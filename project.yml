name: nits
options:
  bundleIdPrefix: com.aarontempleton
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  NitsCore:
    path: .

targets:
  nits:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: NitsCore
        product: NitsCore
    info:
      path: App/Info.plist
      properties:
        # Menu-bar agent: no Dock icon, no main window.
        LSUIElement: true
        CFBundleName: nits
        CFBundleDisplayName: nits
        # From the build settings, so `make release VERSION=…` stamps the bundle.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "Copyright © 2026 Aaron Templeton. MIT License."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarontempleton.nits
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Unsandboxed by necessity: DDC needs private IOKit calls and IORegistry
        # access. This permanently rules out Mac App Store distribution.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # Xcode signs ad-hoc; `make app` then re-signs with the stable local identity
        # from `make signing-cert`, so the Accessibility grant survives rebuilds. A
        # notarized build would need a Developer ID identity and hardened runtime.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        COMBINE_HIDPI_IMAGES: YES
        # App/AppIcon.icon is an Icon Composer document: Liquid Glass on macOS 26, and
        # Xcode renders flat fallbacks for 14 and 15 from the same file.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
